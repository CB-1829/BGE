<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executor</title>
    <!-- Libraries required to parse ZIP, compile JS, and run Python -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body style="margin:0; padding:0; width:100vw; height:100vh; overflow:hidden;">

    <!-- Minimal container required to render full screen visual or HTML payloads -->
    <div id="output" style="width:100%; height:100%;"></div>

    <script>
        /**
         * Place any code file content, raw HTML, JS script, Python code,
         * Data URL, or Base64-encoded .ZIP string directly inside this variable!
         */
        const run_v = `<h1>HELLO!!!!</h1>`;

        (async function executePayload() {
            const container = document.getElementById('output');
            const trimmed = run_v.trim();

            if (!trimmed) return;

            // Helper to check if payload is a zip archive
            const isZip = trimmed.startsWith('data:application/zip') || 
                          trimmed.startsWith('UEsDB') || 
                          trimmed.startsWith('data:application/x-zip-compressed');

            // Helper to check if payload is Python code
            const isPython = !trimmed.startsWith('<') && (
                trimmed.includes('print(') || 
                trimmed.includes('def ') || 
                trimmed.includes('import ') || 
                trimmed.includes('if __name__ ==')
            );

            try {
                if (isZip) {
                    let base64Data = trimmed.includes(',') ? trimmed.split(',')[1] : trimmed;
                    const zip = new JSZip();
                    const zipContent = await zip.loadAsync(base64Data, { base64: true });

                    // Find index.html or first html file inside ZIP
                    let htmlFile = zipContent.file('index.html') || zipContent.file(/.*\.html$/i)[0];

                    if (htmlFile) {
                        const htmlStr = await htmlFile.async('string');
                        renderHtml(htmlStr, container);
                    } else {
                        // Check for JS or Py files inside zip
                        let jsFile = zipContent.file(/.*\.js$/i)[0];
                        let pyFile = zipContent.file(/.*\.py$/i)[0];

                        if (jsFile) {
                            const jsStr = await jsFile.async('string');
                            runJs(jsStr, container);
                        } else if (pyFile) {
                            const pyStr = await pyFile.async('string');
                            await runPython(pyStr, container);
                        } else {
                            container.innerText = "No playable HTML, JS, or PY files found inside the ZIP.";
                        }
                    }
                } else if (trimmed.startsWith('<') || trimmed.toLowerCase().includes('<!doctype html>')) {
                    renderHtml(trimmed, container);
                } else if (isPython) {
                    await runPython(trimmed, container);
                } else {
                    runJs(trimmed, container);
                }
            } catch (err) {
                console.error("Execution error:", err);
                container.innerText = "Error executing run_v content: " + err.message;
            }
        })();

        function renderHtml(htmlContent, container) {
            const iframe = document.createElement('iframe');
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            container.appendChild(iframe);
            iframe.srcdoc = htmlContent;
        }

        function runJs(jsCode, container) {
            try {
                const script = document.createElement('script');
                script.textContent = jsCode;
                document.body.appendChild(script);
            } catch (e) {
                container.innerText = e.message;
            }
        }

        async function runPython(pyCode, container) {
            container.style.color = '#fff';
            container.style.fontFamily = 'monospace';
            container.style.padding = '20px';
            container.style.background = '#0d1117';
            container.innerText = "Initializing Python Runtime...\n";

            const pyodide = await loadPyodide();
            pyodide.setStdout({
                batched: (text) => { container.innerText += text + "\n"; }
            });
            pyodide.setStderr({
                batched: (text) => { container.innerText += "[Error] " + text + "\n"; }
            });

            await pyodide.runPythonAsync(pyCode);
        }
    </script>
</body>
</html>
